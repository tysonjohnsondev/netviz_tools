[project]
name = "netviz-tools"
version = "1.0.0"
description = "Typed, tested tools for building, measuring, and plotting bilateral flow networks, with FAOSTAT trade data as the flagship dataset."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tyson Johnson", email = "tysonjohnsondev@gmail.com" }]
maintainers = [{ name = "Tyson Johnson", email = "tysonjohnsondev@gmail.com" }]
requires-python = ">=3.11"
keywords = ["network analysis", "trade networks", "flow networks", "FAOSTAT", "networkx", "plotly", "duckdb"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.1",
    "networkx>=3.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.22",
    "pooch>=1.8",
    "pyarrow>=16",
    "scipy>=1.13",
]

[project.urls]
Homepage = "https://github.com/tysonjohnsondev/netviz_tools"
Documentation = "https://tysonjohnsondev.github.io/netviz_tools/"
Repository = "https://github.com/tysonjohnsondev/netviz_tools"
Issues = "https://github.com/tysonjohnsondev/netviz_tools/issues"
Changelog = "https://github.com/tysonjohnsondev/netviz_tools/blob/main/CHANGELOG.md"

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=1.0.6",
    "mkdocs-jupyter>=0.25",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "powerlaw>=2.0.0",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "scipy-stubs>=1.14",
    "types-networkx>=3.6.1.20260911",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netviz_tools"]

[tool.hatch.build.targets.sdist]
include = ["src/netviz_tools", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "PTH", "NPY", "PD", "D"]
ignore = [
    "PD008",  # `.at` is the clearest scalar accessor
    "PD010",  # `.unstack` is fine
    "PD101",  # `nunique() > 1` reads better than the suggested idiom
    "D105",   # magic methods do not need docstrings
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PD"]
"scripts/**" = ["D"]
"docs/**" = ["D", "E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["plotly.*", "pooch.*", "networkx.*", "duckdb.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--doctest-modules",
    "-m", "not network",
    "--cov=netviz_tools",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=90",
]
markers = [
    "network: downloads real data from the internet (deselected by default; run with -m network)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["netviz_tools"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]
